name: edge

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.6.9
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, where '.[dev]' is not a quoted
    # extras spec. bash exists on all three runners, so the steps stay one
    # script rather than three.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        include:
          # Anyone cloning this is far more likely to be on a laptop than on
          # Ubuntu, so macOS is tested rather than assumed.
          #
          # Windows is deliberately absent. Release activation swaps a symlink
          # with os.replace so a device that reboots mid-update never comes up
          # with no policy at all, and that is the right design for the Linux
          # boards this actually targets. Windows is not a deployment target
          # for a robot edge runtime, and adding a second activation path for
          # it would mean maintaining two mechanisms where one is exercised.
          # Use WSL on Windows.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -e '.[dev]'
      - run: pytest -q --cov=edge_runtime --cov-report=term-missing

  update-safety:
    # The properties that decide whether an update is something you can do to a
    # robot in the field, or something you have to drive to a robot to do.
    # These are asserted end to end, against the real HTTP path, on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install --upgrade pip
          pip install -e '.[dev]'

      - name: A device must never activate a release it cannot verify
        run: |
          pytest -q \
            tests/test_bundle.py::test_modifying_a_file_invalidates_the_bundle \
            tests/test_bundle.py::test_modifying_the_manifest_invalidates_the_signature \
            tests/test_bundle.py::test_a_bundle_signed_with_another_key_is_refused \
            tests/test_bundle.py::test_unpack_refuses_a_member_that_escapes_the_directory \
            tests/test_bundle.py::test_unpack_refuses_a_symlink_member \
            tests/test_ota.py::test_a_tampered_archive_is_refused_and_never_activated

      - name: A rejected release must not become an update loop
        run: |
          pytest -q \
            tests/test_ota.py::test_a_rejected_version_is_not_downloaded_again \
            tests/test_ota.py::test_quarantine_does_not_block_a_later_good_release \
            tests/test_ota.py::test_repeated_rollbacks_freeze_updates_for_an_operator

      - name: Rollback and device state must survive a restart
        run: |
          pytest -q \
            tests/test_ota.py::test_rollback_returns_to_the_previous_version_and_quarantines_this_one \
            tests/test_ota.py::test_state_survives_a_restart \
            tests/test_ota.py::test_the_previous_bundle_is_kept_not_deleted

      - name: Telemetry must survive the hub being unreachable
        run: |
          pytest -q \
            tests/test_end_to_end.py::test_telemetry_survives_the_hub_being_down \
            tests/test_telemetry.py::test_eviction_sheds_heartbeats_before_failures \
            tests/test_telemetry.py::test_events_are_kept_until_the_hub_acknowledges_them

      - name: The demo must still tell the story it claims to
        # If v2 stops being adopted, or v3 stops being refused, the README is
        # describing something the code no longer does.
        run: |
          edge-runtime demo --workdir "$RUNNER_TEMP/demo" | tee "$RUNNER_TEMP/demo.txt"
          python - <<'PY'
          import os, sys
          text = open(os.environ["RUNNER_TEMP"] + "/demo.txt").read()
          required = [
              ("v2 was not adopted over the air", "device is now on v2"),
              ("v3 was not refused", "rejected by health gate"),
              ("v3 was not quarantined", "quarantined"),
              ("the device did not keep serving", "still serving v2"),
          ]
          problems = [msg for msg, needle in required if needle not in text]
          if problems:
              sys.exit("FAIL: " + "; ".join(problems))
          print("the demo still does what the README says")
          PY

      - name: Quantization must still be measured, not assumed
        run: |
          edge-runtime quantise >> "$GITHUB_STEP_SUMMARY"
          pytest -q \
            tests/test_runtime.py::test_per_tensor_loses_the_joint_channels \
            tests/test_runtime.py::test_the_default_scheme_fails_a_tolerance_the_good_one_passes
